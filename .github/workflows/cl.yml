name: CI - Build & Push Docker Image

on:
  push:
    branches: ["main"]

permissions:
  id-token: write       # required for GitHub OIDC
  contents: read        # required to checkout repo

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mlops-obj-det-api
  IMAGE_TAG: latest

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Lint (fast + strict)
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff .

      # 5️⃣ Run tests
      - name: Run tests
        run: pytest

      # 6️⃣ Configure AWS credentials (OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111490975442:role/github-tf-role
          aws-region: ${{ env.AWS_REGION }}

      # 7️⃣ Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin \
            111490975442.dkr.ecr.$AWS_REGION.amazonaws.com

      # 8️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG .

      # 9️⃣ Tag & push image to ECR
      - name: Push Docker image to ECR
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG \
            111490975442.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            111490975442.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
